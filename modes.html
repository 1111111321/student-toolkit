<head>
  <meta charset="UTF-8">

  <title>模式与地图 · 三角洲资料站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">三角洲资料站</a>

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-nav" aria-label="打开菜单">
        ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="modes.html" aria-current="page">模式与地图</a></li>
          <li><a href="loadout.html">武器与配装</a></li>
          <li><a href="guide.html">新手攻略</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <main id="main">

    <!-- ① 页面标题区：每页都有，说明这一页讲什么 -->
    <section class="hero">
      <div class="container">
        <h1>模式与地图</h1>
        <p>这里写两三句：两种玩法有什么区别，你看完这页能知道什么。</p>
      </div>
    </section>

    <!-- ② 两种模式对比：两个卡片 -->
    <section class="section">
      <div class="container">
        <h2>两种模式</h2>
        <div class="cards">

          <article class="card">
            <h3>烽火地带</h3>
            <p>写清楚它是什么玩法：怎么进、怎么算赢、输了会怎样。</p>
          </article>

          <article class="card">
            <h3>全面战场</h3>
            <p>写清楚它和上一个的区别：规模、目标、节奏。</p>
          </article>

        </div>
      </div>
    </section>

    <!-- ③ 地图表格：一行一张图，难度和人数按你的理解填 -->
    <section class="section">
      <div class="container">
        <h2>地图一览</h2>
        <table>
          <caption>各地图难度与推荐人数</caption>
          <thead>
            <tr>
              <th scope="col">地图</th>
              <th scope="col">难度</th>
              <th scope="col">推荐人数</th>
              <th scope="col">一句话特点</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>地图名</td>
              <td>中</td>
              <td>3</td>
              <td>这里写特点和适合的打法</td>
            </tr>
            <!-- 每张地图复制一行 <tr> -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 三角洲资料站 · 学生作品 · 非官方站点</p>
