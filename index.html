<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="三个打开就能用的小工具：番茄钟、待办清单、考试倒计时。">
  <title>首页 · 学生工具箱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">学生工具箱</a>

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-nav" aria-label="打开菜单">
        ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html" aria-current="page">首页</a></li>
          <li><a href="pomodoro.html">番茄钟</a></li>
          <li><a href="todo.html">待办</a></li>
          <li><a href="countdown.html">倒计时</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <main id="main">

    <!-- ① 首屏：一句话说清这个站有什么用 -->
    <section class="hero">
      <div class="container">
        <h1>三个小工具，打开就能用</h1>
        <p>不用注册、不用联网、不收集任何数据。给写作业的人用的。</p>
        <a class="btn" href="pomodoro.html">先来个番茄钟 →</a>
      </div>
    </section>

    <!-- ② 三个工具入口：复制这张卡片改成另外两个工具 -->
    <section class="section">
      <div class="container">
        <h2>工具</h2>
        <div class="cards">

          <article class="card">
            <h3>番茄钟</h3>
            <p>专注 25 分钟，休息 5 分钟。把注意力拉回一件事上。</p>
            <a href="pomodoro.html">打开 →</a>
          </article>

          <article class="card">
            <h3>待办清单</h3>
            <p>把今天要做的事写下来，做完一件勾掉一件。</p>
            <a href="todo.html">打开 →</a>
          </article>

          <article class="card">
            <h3>考试倒计时</h3>
            <p>选一个日期，看看还剩多少天，心里有个数。</p>
            <a href="countdown.html">打开 →</a>
          </article>

        </div>
      </div>
    </section>

    <!-- ③ 更新日志：写你实际改了什么，也是给老师看的进度 -->
    <section class="section">
      <div class="container">
        <h2>最近更新</h2>
        <ul class="updates">
          <li><time datetime="2026-10-19">10 月 19 日</time> —— 把站点主题从游戏资料站改成工具箱</li>
        </ul>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 学生工具箱 · 个人项目</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
</body>
</html>
