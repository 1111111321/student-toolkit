<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="简单好用的待办清单，添加、勾选、删除任务。">
  <title>待办清单 · 学生工具箱</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">学生工具箱</a>

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-nav" aria-label="打开菜单">
        ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="pomodoro.html">番茄钟</a></li>
          <li><a href="todo.html" aria-current="page">待办</a></li>
          <li><a href="countdown.html">倒计时</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <main id="main">

    <section class="hero">
      <div class="container">
        <h1>待办清单</h1>
        <p>写下来，做完勾掉。别让事情堆在脑子里占内存。</p>
      </div>
    </section>

    <section class="section">
      <div class="container tool tool-wide">

        <!-- 用 form 而不是单独的按钮，这样按回车也能添加 -->
        <form id="todoForm" class="tool-form">
          <label for="todoInput" class="sr-only">新任务</label>
          <input id="todoInput" type="text" placeholder="今天要做什么？" autocomplete="off" required>
          <button class="btn" type="submit">添加</button>
        </form>

        <!-- 空列表，任务由 JS 动态创建 -->
        <ul id="todoList" class="todo-list"></ul>

        <!-- role="status"：数量变化时读屏软件会播报 -->
        <p id="todoCount" class="tool-tip" role="status">还没有任务</p>

        <button id="clearDone" class="btn btn-ghost" type="button">清除已完成</button>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 学生工具箱 · 个人项目</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/todo.js"></script>
</body>
</html>
