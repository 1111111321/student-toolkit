<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple to-do list: add a task, tick it off, clear what is done.">
  <title>To-do list · Student Toolkit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Student Toolkit</a>

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="pomodoro.html">Pomodoro</a></li>
          <li><a href="todo.html" aria-current="page">To-do</a></li>
          <li><a href="countdown.html">Countdown</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main id="main">

    <section class="hero">
      <div class="container">
        <h1>To-do list</h1>
        <p>Write it down and tick it off. Do not keep everything in your head.</p>
      </div>
    </section>

    <section class="section">
      <div class="container tool tool-wide">

        <!-- A form, not just a button, so pressing Enter also adds the task -->
        <form id="todoForm" class="tool-form">
          <label for="todoInput" class="sr-only">New task</label>
          <input id="todoInput" type="text" placeholder="What needs doing today?" autocomplete="off" required>
          <button class="btn" type="submit">Add</button>
        </form>

        <!-- Empty list: the items are created by JavaScript -->
        <ul id="todoList" class="todo-list"></ul>

        <!-- role="status": screen readers announce the count when it changes -->
        <p id="todoCount" class="tool-tip" role="status">No tasks yet</p>

        <button id="clearDone" class="btn btn-ghost" type="button">Clear completed</button>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Student Toolkit · Personal project</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/todo.js"></script>
</body>
</html>
