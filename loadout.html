<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="这里写一句话描述本页。">
  <title>武器与配装 · 三角洲资料站</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">三角洲资料站</a>

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-nav" aria-label="打开菜单">
        ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="modes.html">模式与地图</a></li>
          <li><a href="loadout.html" aria-current="page">武器与配装</a></li>
          <li><a href="guide.html">新手攻略</a></li>
          <li><a href="about.html">关于</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">🌙</button>
    </div>
  </header>

  <main id="main">

    <section class="hero">
      <div class="container">
        <h1>武器与配装</h1>
        <p>这里写两三句：这页收录了哪些枪、适合什么打法。</p>
      </div>
    </section>

    <!-- ① 交互区：按钮的 data-filter 要和表格行的 data-type 一一对应 -->
    <section class="section">
      <div class="container">
        <h2>武器一览</h2>

        <div class="filters" role="group" aria-label="按类型筛选武器">
          <button type="button" class="filter-btn" data-filter="all" aria-pressed="true">全部</button>
          <button type="button" class="filter-btn" data-filter="rifle" aria-pressed="false">突击步枪</button>
          <button type="button" class="filter-btn" data-filter="smg" aria-pressed="false">冲锋枪</button>
          <button type="button" class="filter-btn" data-filter="dmr" aria-pressed="false">射手步枪</button>
          <button type="button" class="filter-btn" data-filter="shotgun" aria-pressed="false">霰弹枪</button>
        </div>

        <!-- 筛选结果提示，读屏软件会念出来 -->
        <p class="filter-hint" id="filterHint" role="status"></p>

        <table>
          <caption>武器基础数据与适用场景</caption>
          <thead>
            <tr>
              <th scope="col">武器</th>
              <th scope="col">类型</th>
              <th scope="col">口径</th>
              <th scope="col">适用场景</th>
              <th scope="col">推荐配件</th>
            </tr>
          </thead>
          <tbody id="weaponBody">
            <!-- 每把枪一行，data-type 填 rifle / smg / dmr / shotgun 之一 -->
            <tr data-type="rifle">
              <td>枪名</td>
              <td>突击步枪</td>
              <td>5.56</td>
              <td>中近距离对枪</td>
              <td>这里写配件</td>
            </tr>
            <!-- 继续加行 -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 三角洲资料站 · 学生作品 · 非官方站点</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
