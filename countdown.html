<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pick an exam date and see how many days are left.">
  <title>Exam countdown · Student Toolkit</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html">Student Toolkit</a>

      <button class="menu-toggle" id="menuToggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open menu">
        ☰
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="pomodoro.html">Pomodoro</a></li>
          <li><a href="todo.html">To-do</a></li>
          <li><a href="countdown.html" aria-current="page">Countdown</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    </div>
  </header>

  <main id="main">

    <section class="hero">
      <div class="container">
        <h1>Exam countdown</h1>
        <p>Pick a date and see how many days are left. Deadlines are easier to face when you can see them.</p>
      </div>
    </section>

    <section class="section">
      <div class="container tool tool-wide">

        <form id="cdForm" class="tool-form">
          <label for="cdDate">Exam date</label>
          <input id="cdDate" type="date" required>
          <button class="btn" type="submit">Calculate</button>
        </form>

        <!-- Result area: role="status" announces the change -->
        <p id="cdResult" class="cd-result" role="status">Pick a date to begin.</p>

      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Student Toolkit · Personal project</p>
    </div>
  </footer>

  <script src="js/common.js"></script>
  <script src="js/countdown.js"></script>
</body>
</html>
